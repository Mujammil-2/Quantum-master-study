<!DOCTYPE html>
<html lang="hi" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ग्लोबल लीडरबोर्ड | क्वांटम मास्टर स्टडी</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* लीडरबोर्ड के लिए स्पेशल CSS */
        .leaderboard-wrapper { max-width: 900px; margin: 0 auto; padding: 20px; }
        .lb-header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
        .lb-header h1 { font-family: var(--font-heading); font-size: 2.5rem; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .lb-header p { color: var(--text-secondary); font-size: 1.1rem; }
        
        /* टॉप 3 पोडियम (Podium) */
        .podium-container { display: flex; justify-content: center; align-items: flex-end; gap: 15px; margin-bottom: 50px; height: 280px; }
        
        .podium-spot { display: flex; flex-direction: column; align-items: center; width: 30%; position: relative; }
        
        /* रैंक 2 */
        .spot-2 { z-index: 2; }
        .spot-2 .podium-base { height: 140px; background: linear-gradient(180deg, #c0c0c0 0%, #808080 100%); border-radius: 15px 15px 0 0; width: 100%; display: flex; justify-content: center; align-items: flex-start; padding-top: 15px; font-size: 2.5rem; font-weight: bold; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .spot-2 .lb-avatar { width: 80px; height: 80px; border: 4px solid #c0c0c0; }
        
        /* रैंक 1 (सबसे ऊपर) */
        .spot-1 { z-index: 3; }
        .spot-1 .podium-base { height: 180px; background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); border-radius: 15px 15px 0 0; width: 100%; display: flex; justify-content: center; align-items: flex-start; padding-top: 15px; font-size: 3.5rem; font-weight: bold; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.5); box-shadow: 0 -10px 30px rgba(255,215,0,0.3); }
        .spot-1 .lb-avatar { width: 110px; height: 110px; border: 5px solid #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.5); }
        .spot-1 .crown-icon { position: absolute; top: -35px; color: #ffd700; font-size: 2.5rem; animation: pulseGlow 2s infinite alternate; }
        
        /* रैंक 3 */
        .spot-3 { z-index: 1; }
        .spot-3 .podium-base { height: 110px; background: linear-gradient(180deg, #cd7f32 0%, #8b4513 100%); border-radius: 15px 15px 0 0; width: 100%; display: flex; justify-content: center; align-items: flex-start; padding-top: 15px; font-size: 2rem; font-weight: bold; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .spot-3 .lb-avatar { width: 70px; height: 70px; border: 4px solid #cd7f32; }
        
        .lb-avatar { border-radius: 50%; object-fit: cover; background: #141c2f; margin-bottom: 15px; position: relative; z-index: 5; }
        .podium-name { font-family: var(--font-heading); color: #fff; font-size: 1.1rem; text-align: center; margin-bottom: 5px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .podium-xp { color: var(--accent-main); font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; }

        /* लिस्ट व्यू (रैंक 4 से 20) */
        .lb-list { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        
        .lb-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: rgba(255,255,255,0.03); border-radius: 12px; transition: 0.3s; }
        .lb-row:hover { background: rgba(255,255,255,0.08); transform: translateX(5px); }
        
        /* करंट यूज़र की रैंक को हाईलाइट करने के लिए */
        .lb-row.current-user-row { border: 2px solid var(--accent-main); background: rgba(var(--accent-rgb), 0.1); }
        
        .row-left { display: flex; align-items: center; gap: 15px; }
        .row-rank { font-size: 1.2rem; font-weight: bold; color: #8b96a8; width: 30px; text-align: center; }
        .row-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.2); }
        .row-name { font-family: var(--font-heading); color: #fff; font-size: 1.1rem; }
        .row-city { font-size: 0.8rem; color: #8b96a8; }
        
        .row-right { text-align: right; }
        .row-xp { color: var(--accent-main); font-weight: bold; font-size: 1.1rem; }
        
        .loading-lb { text-align: center; padding: 50px; color: var(--accent-main); font-size: 1.2rem; }
        
        /* बैक बटन */
        .back-btn-top { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px 15px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; z-index: 100; }
        .back-btn-top:hover { background: var(--accent-main); color: #000; }
    </style>
</head>
<body>

    <!-- फायरफ्लाई बैकग्राउंड -->
    <canvas id="bg-canvas"></canvas>

    <button class="back-btn-top" onclick="window.location.href='dashboard.html'">
        <i class="ri-arrow-left-line"></i> डैशबोर्ड
    </button>

    <div class="leaderboard-wrapper">
        <div class="lb-header">
            <h1><i class="ri-trophy-fill" style="color: #ffd700;"></i> ग्लोबल लीडरबोर्ड</h1>
            <p>QMS के टॉप 20 सबसे होशियार स्टूडेंट्स (Real-time)</p>
        </div>

        <!-- डेटा लोड होने तक लोडिंग दिखाएंगे -->
        <div id="lb-loading" class="loading-lb">
            <i class="ri-loader-4-line" style="animation: spin 1s linear infinite; display: inline-block; font-size: 2rem; margin-bottom: 10px;"></i>
            <p>टॉप 20 स्टूडेंट्स की लिस्ट आ रही है...</p>
        </div>

        <!-- टॉप 3 पोडियम (JS इसे भरेगा) -->
        <div class="podium-container" id="podium-container" style="display: none;">
            <!-- रैंक 2 -->
            <div class="podium-spot spot-2" id="podium-2"></div>
            <!-- रैंक 1 -->
            <div class="podium-spot spot-1" id="podium-1"></div>
            <!-- रैंक 3 -->
            <div class="podium-spot spot-3" id="podium-3"></div>
        </div>

        <!-- लिस्ट व्यू (रैंक 4 से 20) (JS इसे भरेगा) -->
        <div class="lb-list" id="lb-list-container" style="display: none;">
        </div>
    </div>

    <!-- MAIN JAVASCRIPT LOGIC (WITH TYPE="MODULE") -->
    <script type="module" src="leaderboard.js"></script>

    <!-- सिर्फ बैकग्राउंड पार्टिकल्स के लिए छोटा स्क्रिप्ट (ताकि स्क्रीन खाली न लगे) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bgCanvas = document.getElementById('bg-canvas');
            if (bgCanvas) {
                const ctx = bgCanvas.getContext('2d'); 
                bgCanvas.width = window.innerWidth; 
                bgCanvas.height = window.innerHeight;
                let particles = [];
                for(let i=0; i<30; i++) {
                    particles.push({
                        x: Math.random() * bgCanvas.width,
                        y: Math.random() * bgCanvas.height,
                        s: Math.random() * 2 + 1,
                        vx: Math.random() * 1 - 0.5,
                        vy: Math.random() * -1 - 0.2
                    });
                }
                function anim() {
                    ctx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
                    ctx.fillStyle = 'rgba(0, 240, 255, 0.5)';
                    particles.forEach(p => {
                        p.x += p.vx; p.y += p.vy;
                        if(p.y < 0) { p.y = bgCanvas.height; p.x = Math.random() * bgCanvas.width; }
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
                    });
                    requestAnimationFrame(anim);
                }
                anim();
            }
        });
    </script>
</body>
</html>
