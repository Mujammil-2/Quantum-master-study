<!DOCTYPE html>
<html lang="hi" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>स्टडी वर्कस्पेस | क्वांटम मास्टर स्टडी</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="player.css">
    <style>
        .header-profile-fix { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--accent-main); overflow: hidden; cursor: pointer; box-shadow: 0 0 10px rgba(0,240,255,0.2); }
        .header-profile-fix img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <audio id="sfx-click" preload="auto"><source src="click.mp3" type="audio/mpeg"></audio>
    <canvas id="bg-canvas"></canvas>

    <div class="player-wrapper">
        <header class="dash-header glass-panel" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="brand-mini sfx-trigger" id="back-to-chapters" style="cursor:pointer;">
                <i class="ri-arrow-left-line"></i><h2>अध्यायों पर लौटें</h2>
            </div>
            <div class="header-profile-fix sfx-trigger" onclick="window.location.href='dashboard.html'">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Student&backgroundColor=b6e3f4" id="nav-profile-img" alt="Profile">
            </div>
        </header>

        <main class="player-grid">
            <div class="video-section span-2">
                <div class="video-container glass-card">
                    <iframe id="main-video" src="https://www.youtube.com/embed/ysz5S6PUM-U" title="QMS Video Player" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="video-info glass-card">
                    <span class="tag" id="player-subject-tag">Subject</span>
                    <h1 id="player-chapter-title">अध्याय लोड हो रहा है...</h1>
                    <div class="action-buttons" style="margin-top: 20px;">
                        <button class="btn-secondary sfx-trigger" id="btn-view-notes"><i class="ri-eye-line"></i> नोट्स पढ़ें</button>
                        <button class="btn-primary-glow sfx-trigger" id="mark-complete-btn"><i class="ri-check-double-line"></i> पूर्ण चिह्नित करें</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="player.js"></script>
</body>
</html>
