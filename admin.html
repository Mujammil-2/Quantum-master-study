<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Quantum Master Study</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #050b14; color: #fff; min-height: 100vh; overflow-x: hidden; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #0c1322; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-box img { height: 40px; border-radius: 6px; }
        .logo-box h2 { font-size: 1.2rem; color: #d4af37; } 
        
        .admin-info { display: flex; align-items: center; gap: 20px; }
        .admin-email { font-size: 0.9rem; color: #8b96a8; }
        .logout-btn { background: rgba(234, 67, 53, 0.1); color: #ea4335; border: 1px solid #ea4335; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; gap: 5px; align-items: center; transition: 0.3s; }
        .logout-btn:hover { background: #ea4335; color: #fff; }
        
        /* Dashboard Container */
        .container { padding: 30px; max-width: 1200px; margin: auto; }
        
        .page-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .page-title h1 { font-size: 1.8rem; font-weight: 600; }
        .refresh-btn { background: #0055ff; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #0c1322; padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 50px; height: 50px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; }
        .stat-icon.pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .stat-icon.approved { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .stat-info h3 { font-size: 1.5rem; margin-bottom: 3px; }
        .stat-info p { font-size: 0.85rem; color: #8b96a8; }

        /* Table Design */
        .table-container { background: #0c1322; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: #8b96a8; font-size: 0.85rem; font-weight: 500; background: rgba(0,0,0,0.2); }
        td { font-size: 0.95rem; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge.pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
        
        .view-btn { background: rgba(0, 240, 255, 0.1); color: #00f0ff; border: 1px solid #00f0ff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
        .view-btn:hover { background: #00f0ff; color: #000; }

        /* 🔥 KUNDALI MODAL (POPUP) DESIGN 🔥 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .glass-modal { background: rgba(12, 19, 34, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; width: 90%; max-width: 400px; padding: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); position: relative; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .close-btn { position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: #8b96a8; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { color: #ea4335; }

        /* Modal Header (Photo & Name) */
        .k-header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .k-header img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #00f0ff; object-fit: cover; margin-bottom: 10px; }
        .k-header h2 { font-size: 1.3rem; margin-bottom: 5px; color: #fff; }
        .k-course { font-size: 0.8rem; background: rgba(212, 175, 55, 0.1); color: #d4af37; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.3); }

        /* Modal Body (Details) */
        .k-body { margin-bottom: 25px; }
        .k-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 0.9rem; color: #cbd5e1; }
        .k-row i { color: #0055ff; font-size: 1.2rem; }
        
        .k-utr-box { background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.2); padding: 15px; border-radius: 10px; text-align: center; margin-top: 15px; }
        .k-utr-box p { font-size: 0.75rem; color: #8b96a8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .k-utr-box h3 { color: #d4af37; font-size: 1.4rem; letter-spacing: 2px; }

        /* Modal Actions */
        .k-actions { display: flex; gap: 10px; }
        .btn-approve { flex: 1; background: #10b981; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; transition: 0.3s; }
        .btn-approve:hover { background: #059669; }
        .btn-reject { flex: 1; background: transparent; color: #ea4335; border: 1px solid #ea4335; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; transition: 0.3s; }
        .btn-reject:hover { background: rgba(234, 67, 53, 0.1); }

        /* Loader Overlay */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050b14; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #0055ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Security Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <h2 style="color: #fff; font-size: 1.2rem;">Verifying Admin Access...</h2>
    </div>

    <!-- 👁️ KUNDALI MODAL (POPUP) 👁️ -->
    <div id="kundali-modal" class="modal-overlay">
        <div class="glass-modal">
            <button class="close-btn" onclick="closeKundali()"><i class="ri-close-line"></i></button>

            <!-- Profile Header -->
            <div class="k-header">
                <img id="k-photo" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" alt="User DP">
                <h2 id="k-name">Loading...</h2>
                <span id="k-course" class="k-course">Course Name</span>
            </div>

            <!-- Details List -->
            <div class="k-body">
                <div class="k-row"><i class="ri-whatsapp-line"></i> <span id="k-phone"></span></div>
                <div class="k-row"><i class="ri-mail-line"></i> <span id="k-email"></span></div>
                <div class="k-row"><i class="ri-map-pin-line"></i> <span id="k-address"></span></div>
                
                <div class="k-utr-box">
                    <p>₹5 Entry Pass UTR</p>
                    <h3 id="k-utr">000000000000</h3>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="k-actions">
                <button class="btn-approve" onclick="approveEntry()"><i class="ri-check-double-line"></i> Approve Entry</button>
                <button class="btn-reject" onclick="rejectEntry()"><i class="ri-close-circle-line"></i> Reject</button>
            </div>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo-box">
            <img src="logo.png" alt="QMS Logo">
            <h2>QMS Admin</h2>
        </div>
        <div class="admin-info">
            <span class="admin-email" id="admin-email-display">Loading...</span>
            <button class="logout-btn" onclick="logoutAdmin()"><i class="ri-logout-box-r-line"></i> Logout</button>
        </div>
    </nav>

    <!-- Dashboard -->
    <div class="container">
        <div class="page-title">
            <h1>Pending Entry Requests (₹5)</h1>
            <button class="refresh-btn" onclick="fetchPendingRequests()"><i class="ri-refresh-line"></i> Refresh</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon pending"><i class="ri-time-line"></i></div>
                <div class="stat-info">
                    <h3 id="pending-count">0</h3>
                    <p>Pending Approvals</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon approved"><i class="ri-check-double-line"></i></div>
                <div class="stat-info">
                    <h3 id="approved-count">Total</h3>
                    <p>Inside Dashboard</p>
                </div>
            </div>
        </div>

        <!-- Requests Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Mobile Number</th>
                        <th>Applied On</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="5" style="text-align: center; color: #8b96a8;">Loading data from Firebase...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCkxx9bVjvAYarA0WrHfW5k_gxwUPZaaw",
            authDomain: "quantum-master-study.firebaseapp.com",
            projectId: "quantum-master-study",
            storageBucket: "quantum-master-study.firebasestorage.app",
            messagingSenderId: "193145760847",
            appId: "1:193145760847:web:7d1f77be123c3edb104e3a",
            measurementId: "G-SH39JL930R"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 🚨 Super Admins Only
        const ADMIN_EMAILS = ["khanmujammil33723@gmail.com", "mujammil.khan06618@gmail.com"];

        // Global Object to Cache User Data (ताकि कुण्डली तुरंत खुले)
        let usersDataCache = {};
        let currentSelectedUserId = null;

        // 1. Check Security
        onAuthStateChanged(auth, (user) => {
            if (user && user.email && ADMIN_EMAILS.includes(user.email.toLowerCase())) {
                document.getElementById('admin-email-display').innerText = user.email;
                document.getElementById('loader').style.display = 'none';
                fetchPendingRequests();
            } else {
                alert("ACCESS DENIED: Unauthorized.");
                window.location.href = "index.html"; 
            }
        });

        // 2. Fetch Pending Entry Requests
        window.fetchPendingRequests = async () => {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Fetching latest requests...</td></tr>`;
            
            try {
                // Fetching users who submitted ₹5 UTR
                const q = query(collection(db, "users"), where("entryPaymentStatus", "==", "pending"));
                const querySnapshot = await getDocs(q);
                
                document.getElementById('pending-count').innerText = querySnapshot.size;
                tableBody.innerHTML = "";
                usersDataCache = {}; // Clear old cache

                if(querySnapshot.empty) {
                    tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #8b96a8;">No pending requests! You are all caught up.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    usersDataCache[docSnap.id] = data; // Cache data for modal

                    // Format Date
                    let dateStr = "Recently";
                    if(data.timestamp) {
                        const d = new Date(data.timestamp);
                        dateStr = d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    }

                    let row = `
                        <tr>
                            <td><strong>${data.name || 'N/A'}</strong></td>
                            <td>${data.phone || data.email || 'N/A'}</td>
                            <td>${dateStr}</td>
                            <td><span class="badge pending">Pending</span></td>
                            <td>
                                <button class="view-btn" onclick="openKundali('${docSnap.id}')">
                                    <i class="ri-eye-line"></i> View Profile
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error:", error);
                tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ea4335;">Database Error! Check console.</td></tr>`;
            }
        };

        // 3. Open Modal (कुण्डली खोलो)
        window.openKundali = (userId) => {
            currentSelectedUserId = userId;
            const data = usersDataCache[userId];

            if(!data) return alert("Error loading user data!");

            // Populate Modal Data
            document.getElementById('k-photo').src = data.photoURL || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
            document.getElementById('k-name').innerText = data.name || "N/A";
            document.getElementById('k-course').innerText = data.course || "General Student";
            document.getElementById('k-phone').innerText = data.phone || "No Number Provided";
            document.getElementById('k-email').innerText = data.email || "No Email Provided";
            
            // Full Address merge
            let fullAddress = [data.address, data.city, data.state].filter(Boolean).join(", ");
            document.getElementById('k-address').innerText = fullAddress || "Address not updated";
            
            document.getElementById('k-utr').innerText = data.entryUtrNumber || "N/A";

            // Show Modal
            document.getElementById('kundali-modal').style.display = "flex";
        };

        window.closeKundali = () => {
            document.getElementById('kundali-modal').style.display = "none";
            currentSelectedUserId = null;
        };

        // 4. Approve Entry (₹5 Verified)
        window.approveEntry = async () => {
            if(!currentSelectedUserId) return;
            let confirmAction = confirm("UTR मैच हो गया? क्या आप इसे डैशबोर्ड की एक्सेस देना चाहते हैं?");
            if(!confirmAction) return;

            try {
                const userRef = doc(db, "users", currentSelectedUserId);
                await updateDoc(userRef, {
                    entryPaymentStatus: "approved",
                    hasEntryPass: true // Gate Unlocked
                });
                alert("✅ Entry Approved! Student can now access the Dashboard.");
                closeKundali();
                fetchPendingRequests(); // Refresh table
            } catch (error) {
                alert("Error approving: " + error.message);
            }
        };

        // 5. Reject Entry (Fake UTR)
        window.rejectEntry = async () => {
            if(!currentSelectedUserId) return;
            let confirmAction = confirm("चेतावनी: क्या आप इस रिक्वेस्ट को रिजेक्ट करना चाहते हैं? (फेक UTR?)");
            if(!confirmAction) return;

            try {
                const userRef = doc(db, "users", currentSelectedUserId);
                await updateDoc(userRef, {
                    entryPaymentStatus: "rejected",
                    entryUtrNumber: null // Reset UTR so they can retry
                });
                alert("❌ Request Rejected!");
                closeKundali();
                fetchPendingRequests();
            } catch (error) {
                alert("Error rejecting: " + error.message);
            }
        };

        // Logout
        window.logoutAdmin = () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        };
    </script>
</body>
</html>
