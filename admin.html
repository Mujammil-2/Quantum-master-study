<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Quantum Master Study</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #050b14; color: #fff; min-height: 100vh; overflow-x: hidden; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #0c1322; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-box img { height: 40px; }
        .logo-box h2 { font-size: 1.2rem; color: #d4af37; } /* Gold color matching logo */
        
        .admin-info { display: flex; align-items: center; gap: 20px; }
        .admin-email { font-size: 0.9rem; color: #8b96a8; }
        .logout-btn { background: #ea4335; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; gap: 5px; align-items: center; }
        
        /* Dashboard Container */
        .container { padding: 30px; max-width: 1200px; margin: auto; }
        
        .page-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .page-title h1 { font-size: 1.8rem; font-weight: 600; }
        .refresh-btn { background: #0055ff; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #0c1322; padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 50px; height: 50px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; }
        .stat-icon.pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .stat-icon.approved { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .stat-info h3 { font-size: 1.5rem; margin-bottom: 3px; }
        .stat-info p { font-size: 0.85rem; color: #8b96a8; }

        /* Table */
        .table-container { background: #0c1322; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: #8b96a8; font-size: 0.85rem; font-weight: 500; background: rgba(0,0,0,0.2); }
        td { font-size: 0.95rem; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge.pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        
        .action-btns { display: flex; gap: 10px; }
        .approve-btn { background: #10b981; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .reject-btn { background: #ea4335; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }

        /* Loader Overlay */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050b14; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #0055ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Security Loader (Stops unauthorized users from seeing the page) -->
    <div id="loader">
        <div class="spinner"></div>
        <h2 style="color: #fff;">Verifying Admin Access...</h2>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo-box">
            <img src="logo.png" alt="QMS Logo">
            <h2>QMS Admin Panel</h2>
        </div>
        <div class="admin-info">
            <span class="admin-email" id="admin-email-display">Loading...</span>
            <button class="logout-btn" onclick="logoutAdmin()"><i class="ri-logout-box-r-line"></i> Logout</button>
        </div>
    </nav>

    <!-- Dashboard -->
    <div class="container">
        <div class="page-title">
            <h1>Payment Verification</h1>
            <button class="refresh-btn" onclick="fetchPendingRequests()"><i class="ri-refresh-line"></i> Refresh</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon pending"><i class="ri-time-line"></i></div>
                <div class="stat-info">
                    <h3 id="pending-count">0</h3>
                    <p>Pending Approvals</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon approved"><i class="ri-check-double-line"></i></div>
                <div class="stat-info">
                    <h3 id="approved-count">0</h3>
                    <p>Total PRO Students</p>
                </div>
            </div>
        </div>

        <!-- Requests Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Email / Phone</th>
                        <th>UTR Number</th>
                        <th>Date & Time</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="6" style="text-align: center; color: #8b96a8;">Loading data from Firebase...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCkxx9bVjvAYarA0WrHfW5k_gxwUPZaaw",
            authDomain: "quantum-master-study.firebaseapp.com",
            projectId: "quantum-master-study",
            storageBucket: "quantum-master-study.firebasestorage.app",
            messagingSenderId: "193145760847",
            appId: "1:193145760847:web:7d1f77be123c3edb104e3a",
            measurementId: "G-SH39JL930R"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 🚨 HIGH SECURITY: Only these emails can open this page
        const ADMIN_EMAILS = ["khanmujammil33723@gmail.com", "mujammil.khan06618@gmail.com"];

        // 1. Check Security on Page Load
        onAuthStateChanged(auth, (user) => {
            if (user && user.email && ADMIN_EMAILS.includes(user.email.toLowerCase())) {
                // Access Granted
                document.getElementById('admin-email-display').innerText = user.email;
                document.getElementById('loader').style.display = 'none';
                fetchPendingRequests();
            } else {
                // Kick out hackers or normal users
                alert("ACCESS DENIED: You are not authorized to view the Admin Panel.");
                window.location.href = "index.html"; 
            }
        });

        // 2. Fetch Data from Firestore
        window.fetchPendingRequests = async () => {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center;">Fetching latest requests...</td></tr>`;
            
            try {
                // Assuming you store users in a 'users' collection
                const q = query(collection(db, "users"), where("paymentStatus", "==", "pending"));
                const querySnapshot = await getDocs(q);
                
                document.getElementById('pending-count').innerText = querySnapshot.size;
                tableBody.innerHTML = "";

                if(querySnapshot.empty) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #8b96a8;">No pending requests! You are all caught up.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    let row = `
                        <tr>
                            <td><strong>${data.name || 'N/A'}</strong></td>
                            <td>${data.email || data.phone || 'N/A'}</td>
                            <td style="color: #d4af37; font-weight: 600;">${data.utrNumber || 'N/A'}</td>
                            <td>${data.date || 'Recently'}</td>
                            <td><span class="badge pending">Pending</span></td>
                            <td class="action-btns">
                                <button class="approve-btn" onclick="approvePayment('${docSnap.id}')">Approve</button>
                                <button class="reject-btn" onclick="rejectPayment('${docSnap.id}')">Reject</button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error fetching data:", error);
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #ea4335;">Database Error: Create Firestore 'users' collection first!</td></tr>`;
            }
        };

        // 3. Approve Action
        window.approvePayment = async (userId) => {
            let confirmAction = confirm("क्या आपने बैंक में UTR मैच कर लिया है? Approve करें?");
            if(!confirmAction) return;

            try {
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, {
                    paymentStatus: "approved",
                    isPremium: true
                });
                alert("✅ Account Successfully Upgraded to PRO!");
                fetchPendingRequests(); // Refresh table
            } catch (error) {
                alert("Error approving: " + error.message);
            }
        };

        // 4. Reject Action
        window.rejectPayment = async (userId) => {
            let confirmAction = confirm("चेतावनी: क्या आप इस रिक्वेस्ट को रिजेक्ट करना चाहते हैं? (पैसा नहीं आया?)");
            if(!confirmAction) return;

            try {
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, {
                    paymentStatus: "rejected",
                    utrNumber: null
                });
                alert("❌ Request Rejected!");
                fetchPendingRequests();
            } catch (error) {
                alert("Error rejecting: " + error.message);
            }
        };

        // Logout
        window.logoutAdmin = () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        };
    </script>
</body>
</html>
