<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile | Quantum Master Study</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root { --bg-deep: #020612; --accent-cyan: #00f0ff; --accent-blue: #0055ff; }
        body { background-color: var(--bg-deep); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .profile-card { background: linear-gradient(180deg, #10182b 0%, #0b1120 100%); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 35px 30px; width: 100%; max-width: 500px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .card-header { text-align: center; margin-bottom: 25px; }
        .card-header h2 { font-size: 1.8rem; font-weight: 700; color: #fff; }
        .card-header p { font-size: 0.9rem; color: #8b96a8; }

        /* Camera & Selfie Section */
        .avatar-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; }
        .avatar-box { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--accent-cyan); overflow: hidden; position: relative; background: #141c2f; margin-bottom: 12px; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-box video { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .camera-btns { display: flex; gap: 10px; }
        .cam-btn { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 8px 15px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .cam-btn:hover { background: var(--accent-cyan); color: #000; }
        .capture-btn { background: #ff0055; border: 1px solid #ff0055; color: #fff; display: none; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; font-weight: 500; }
        .form-control { width: 100%; background: #141c2f; border: 1px solid #1e293b; color: #fff; padding: 12px 15px; border-radius: 10px; font-size: 0.95rem; }
        .form-control:focus { outline: none; border-color: var(--accent-cyan); }
        .row-2 { display: flex; gap: 15px; }
        .row-2 .form-group { flex: 1; }

        .save-btn { width: 100%; background: var(--accent-blue); color: #fff; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 15px; }
        
        .toast-msg { position: fixed; top: 20px; right: -350px; background: #111827; border-left: 4px solid var(--accent-cyan); color: #fff; padding: 15px 20px; border-radius: 8px; z-index: 1000; transition: 0.4s; }
        .toast-msg.show { right: 20px; }
    </style>
</head>
<body>

    <div id="toast" class="toast-msg"><span id="toast-text"></span></div>

    <div class="profile-card">
        <div class="card-header">
            <h2>Complete Your Profile</h2>
            <p>Take a live selfie & fill in your details!</p>
        </div>

        <!-- CAMERA SECTION -->
        <div class="avatar-section">
            <div class="avatar-box">
                <img id="avatar-preview" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" alt="Profile">
                <video id="camera-stream" autoplay playsinline></video>
                <canvas id="camera-canvas" style="display:none;"></canvas>
            </div>
            <div class="camera-btns">
                <button id="start-cam-btn" class="cam-btn" onclick="startCamera()"><i class="ri-camera-line"></i> Take Live Selfie</button>
                <button id="capture-cam-btn" class="cam-btn capture-btn" onclick="captureSelfie()"><i class="ri-focus-3-line"></i> Capture Now</button>
            </div>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="p-name" class="form-control" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="p-email" class="form-control" placeholder="Enter your email address">
        </div>

        <div class="row-2">
            <div class="form-group">
                <label>Gender</label>
                <select id="p-gender" class="form-control">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" id="p-city" class="form-control" placeholder="e.g. Maihar">
            </div>
        </div>

        <div class="row-2">
            <div class="form-group">
                <label>State</label>
                <input type="text" id="p-state" class="form-control" placeholder="e.g. Madhya Pradesh">
            </div>
            <div class="form-group">
                <label>Country</label>
                <input type="text" id="p-country" class="form-control" value="India">
            </div>
        </div>

        <button class="save-btn" onclick="saveProfileData()">Save Profile & Go to Dashboard</button>
    </div>

    <script>
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // Load existing data if logged in via Google
        window.onload = () => {
            document.getElementById('p-name').value = localStorage.getItem('qms_user_name') || '';
            const emailField = document.getElementById('p-email');
            emailField.value = localStorage.getItem('qms_user_email') || '';
            
            if(localStorage.getItem('qms_auth_provider') === 'Google') {
                emailField.readOnly = true; emailField.style.opacity = '0.6';
            }
            const savedPhoto = localStorage.getItem('qms_user_photo');
            if(savedPhoto) document.getElementById('avatar-preview').src = savedPhoto;
        };

        // 📷 LIVE CAMERA LOGIC
        let videoStream = null;

        async function startCamera() {
            try {
                // Request camera permission
                videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('camera-stream');
                video.srcObject = videoStream;
                video.style.display = 'block';
                document.getElementById('avatar-preview').style.display = 'none';
                
                document.getElementById('start-cam-btn').style.display = 'none';
                document.getElementById('capture-cam-btn').style.display = 'flex';
                showToast("Camera started! Smile please :)");
            } catch (err) {
                showToast("Camera access denied! Please allow camera permissions.");
            }
        }

        function captureSelfie() {
            const video = document.getElementById('camera-stream');
            const canvas = document.getElementById('camera-canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Draw image on canvas and convert to Base64 Image URL
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/png'); // This is the selfie!

            // Stop Camera
            videoStream.getTracks().forEach(track => track.stop());
            video.style.display = 'none';

            // Show Selfie in Avatar Box
            const img = document.getElementById('avatar-preview');
            img.src = imageData;
            img.style.display = 'block';

            // Reset buttons
            document.getElementById('capture-cam-btn').style.display = 'none';
            const startBtn = document.getElementById('start-cam-btn');
            startBtn.innerHTML = '<i class="ri-refresh-line"></i> Retake Selfie';
            startBtn.style.display = 'flex';

            // Save selfie temporarily
            localStorage.setItem('qms_user_photo', imageData);
            showToast("Selfie Captured Successfully! 📸");
        }

        // 💾 SAVE FINAL DATA
        function saveProfileData() {
            const name = document.getElementById('p-name').value.trim();
            const email = document.getElementById('p-email').value.trim();
            if(!name || !email) { showToast("Name and Email are required!"); return; }

            localStorage.setItem('qms_user_name', name);
            localStorage.setItem('qms_user_email', email);
            localStorage.setItem('qms_user_gender', document.getElementById('p-gender').value);
            localStorage.setItem('qms_user_city', document.getElementById('p-city').value.trim());
            localStorage.setItem('qms_user_state', document.getElementById('p-state').value.trim());
            localStorage.setItem('qms_user_country', document.getElementById('p-country').value.trim());

            showToast("Profile Saved! Welcome to Quantum Master Study.");
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
        }
    </script>
</body>
</html>
