<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile | Quantum Master Study</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root { --bg-deep: #020612; --card-bg: #0b1120; --btn-bg: #141c2f; --btn-border: #1e293b; --accent-cyan: #00f0ff; --accent-blue: #0055ff; }
        body { background-color: var(--bg-deep); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
        
        .ambient-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70vw; height: 70vh; background: radial-gradient(ellipse, rgba(0, 85, 255, 0.15) 0%, transparent 70%); filter: blur(80px); z-index: -1; }

        .profile-card { background: linear-gradient(180deg, rgba(16, 24, 43, 0.95) 0%, rgba(11, 17, 32, 0.95) 100%); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 35px 30px; width: 100%; max-width: 480px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .card-header { text-align: center; margin-bottom: 25px; }
        .card-header h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; color: #fff; }
        .card-header p { font-size: 0.9rem; color: #8b96a8; }

        .avatar-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; }
        .avatar-box { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--accent-cyan); overflow: hidden; position: relative; margin-bottom: 10px; background: #141c2f; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .change-photo-btn { background: transparent; border: none; color: var(--accent-cyan); font-size: 0.85rem; cursor: pointer; font-weight: 500; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        .form-control { width: 100%; background: #141c2f; border: 1px solid #1e293b; color: #fff; padding: 12px 15px; border-radius: 10px; font-size: 0.95rem; }
        .form-control:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }

        .row-2 { display: flex; gap: 15px; }
        .row-2 .form-group { flex: 1; }

        .save-btn { width: 100%; background: linear-gradient(135deg, var(--accent-blue), #00a8ff); color: #fff; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; box-shadow: 0 5px 20px rgba(0, 85, 255, 0.4); }
        .save-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Toast Message */
        .toast-msg { position: fixed; top: 20px; right: -350px; background: #111827; border-left: 4px solid var(--accent-cyan); color: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; font-size: 0.9rem; transition: right 0.4s ease; z-index: 1000; }
        .toast-msg.show { right: 20px; }
    </style>
</head>
<body>

    <div id="login-toast" class="toast-msg"><i class="ri-information-line"></i><span id="toast-text">Profile Updated!</span></div>

    <div class="ambient-glow"></div>

    <div class="profile-card">
        <div class="card-header">
            <h2>Complete Your Profile</h2>
            <p>Help us customize your learning experience</p>
        </div>

        <div class="avatar-section">
            <div class="avatar-box">
                <img id="user-avatar-preview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Profile Photo">
            </div>
            <button class="change-photo-btn" onclick="triggerPhotoChange()"><i class="ri-camera-line"></i> Change Photo URL</button>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="p-name" class="form-control" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="p-email" class="form-control" readonly style="opacity: 0.7;">
        </div>

        <div class="row-2">
            <div class="form-group">
                <label>Gender</label>
                <select id="p-gender" class="form-control">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" id="p-city" class="form-control" placeholder="e.g. Maihar">
            </div>
        </div>

        <div class="row-2">
            <div class="form-group">
                <label>State</label>
                <input type="text" id="p-state" class="form-control" placeholder="e.g. Madhya Pradesh">
            </div>
            <div class="form-group">
                <label>Country</label>
                <input type="text" id="p-country" class="form-control" value="India">
            </div>
        </div>

        <button class="save-btn" onclick="saveProfileData()">Save & Continue to Dashboard <i class="ri-arrow-right-line"></i></button>
    </div>

    <script>
        function showToast(msg) {
            const toast = document.getElementById('login-toast');
            document.getElementById('toast-text').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // Load existing session data into form
        window.addEventListener('DOMContentLoaded', () => {
            const name = localStorage.getItem('qms_user_name') || 'Quantum Scholar';
            const email = localStorage.getItem('qms_user_email') || 'scholar@qms.com';
            const photo = localStorage.getItem('qms_user_photo') || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150';
            
            document.getElementById('p-name').value = name;
            document.getElementById('p-email').value = email;
            document.getElementById('user-avatar-preview').src = photo;

            if(localStorage.getItem('qms_user_gender')) document.getElementById('p-gender').value = localStorage.getItem('qms_user_gender');
            if(localStorage.getItem('qms_user_city')) document.getElementById('p-city').value = localStorage.getItem('qms_user_city');
            if(localStorage.getItem('qms_user_state')) document.getElementById('p-state').value = localStorage.getItem('qms_user_state');
            if(localStorage.getItem('qms_user_country')) document.getElementById('p-country').value = localStorage.getItem('qms_user_country');
        });

        function triggerPhotoChange() {
            const newPhoto = prompt("Enter Image URL for your profile picture:", document.getElementById('user-avatar-preview').src);
            if(newPhoto) {
                document.getElementById('user-avatar-preview').src = newPhoto;
                localStorage.setItem('qms_user_photo', newPhoto);
                showToast("Profile picture updated!");
            }
        }

        function saveProfileData() {
            const name = document.getElementById('p-name').value.trim();
            const gender = document.getElementById('p-gender').value;
            const city = document.getElementById('p-city').value.trim();
            const state = document.getElementById('p-state').value.trim();
            const country = document.getElementById('p-country').value.trim();

            if(!name || !city || !state) {
                showToast("Please fill in all required fields!");
                return;
            }

            localStorage.setItem('qms_user_name', name);
            localStorage.setItem('qms_user_gender', gender);
            localStorage.setItem('qms_user_city', city);
            localStorage.setItem('qms_user_state', state);
            localStorage.setItem('qms_user_country', country);

            showToast("Profile saved successfully! Redirecting...");
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1200);
        }
    </script>
</body>
</html>
