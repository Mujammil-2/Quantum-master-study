<!DOCTYPE html>
<html lang="hi" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अध्याय | क्वांटम मास्टर स्टडी</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chapters.css">
</head>
<body>

    <!-- तुम्हारा नया प्रीमियम साउंड यहाँ लग गया है -->
    <audio id="sfx-click" preload="auto">
        <source src="click.mp3" type="audio/mpeg">
    </audio>

    <div id="particle-canvas-container"></div>

    <div class="dashboard-wrapper">
        <header class="dash-header glass-panel">
            <div class="brand-mini sfx-trigger" onclick="window.location.href='subjects.html'" style="cursor:pointer;">
                <i class="ri-arrow-left-line"></i>
                <h2>विषयों पर लौटें</h2>
            </div>
        </header>

        <main class="chapters-main">
            <div class="subject-hero-card glass-card" id="subject-hero-card">
                <div class="hero-content">
                    <p class="board-tag">कक्षा 12वीं • NCERT</p>
                    <div class="hero-title-group">
                        <div class="hero-icon" id="hero-icon"><i class="ri-flashlight-fill"></i></div>
                        <div>
                            <h1 id="subject-title">भौतिक विज्ञान</h1>
                            <p id="subject-subtitle">Physics (PCM)</p>
                        </div>
                    </div>
                </div>
                <div class="progress-stats">
                    <span id="total-chapters-count">कुल अध्याय: 0</span>
                    <span>0% पूर्ण</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" style="width: 0%;"></div>
                </div>
            </div>

            <div class="chapters-header">
                <h2>सभी अध्याय</h2>
                <i class="ri-sort-desc"></i>
            </div>

            <div class="chapters-list" id="dynamic-chapter-list">
                <!-- Chapters load here -->
            </div>
        </main>
    </div>

    <script src="chapters.js"></script>
</body>
</html>
