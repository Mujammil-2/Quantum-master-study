<!DOCTYPE html>
<html lang="hi" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अध्याय | क्वांटम मास्टर स्टडी</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <!-- सिर्फ style.css लिंक होगी, और कोई CSS फाइल नहीं -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- कस्टम साउंड -->
    <audio id="sfx-click" preload="auto">
        <source src="click.mp3" type="audio/mpeg">
    </audio>

    <!-- जुगनू एनीमेशन (Fireflies & Formulas) -->
    <canvas id="bg-canvas"></canvas>

    <div class="dashboard-wrapper">
        <header class="glass-panel" style="display: flex; padding: 1.2rem 1.5rem; align-items: center; justify-content: space-between;">
            <div class="brand-mini sfx-trigger" onclick="window.location.href='subjects.html'" style="cursor:pointer; display: flex; align-items: center; gap: 8px;">
                <i class="ri-arrow-left-line" style="font-size: 1.5rem; color: var(--accent-main);"></i>
                <h2 style="font-size: 1.2rem; font-family: var(--font-hindi); font-weight: 600;">विषयों पर लौटें</h2>
            </div>
            <div class="mini-qms-logo" style="width: 35px; height: 35px;">
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="15" fill="var(--accent-main)"/>
                    <ellipse cx="50" cy="50" rx="40" ry="15" fill="none" stroke="var(--accent-main)" stroke-width="4" transform="rotate(0 50 50)"/>
                    <ellipse cx="50" cy="50" rx="40" ry="15" fill="none" stroke="var(--accent-main)" stroke-width="4" transform="rotate(60 50 50)"/>
                    <ellipse cx="50" cy="50" rx="40" ry="15" fill="none" stroke="var(--accent-main)" stroke-width="4" transform="rotate(120 50 50)"/>
                </svg>
            </div>
        </header>

        <main class="chapters-main">
            <!-- सब्जेक्ट हीरो कार्ड -->
            <div class="subject-hero-card glass-card" id="subject-hero-card">
                <div class="hero-content">
                    <p class="board-tag">कक्षा 12वीं • NCERT</p>
                    <div class="hero-title-group">
                        <div class="hero-icon" id="hero-icon"><i class="ri-flashlight-fill"></i></div>
                        <div>
                            <h1 id="subject-title">लोड हो रहा है...</h1>
                            <p id="subject-subtitle">Loading...</p>
                        </div>
                    </div>
                </div>
                
                <div class="progress-stats">
                    <span id="total-chapters-count">कुल अध्याय: 0</span>
                    <span id="progress-text-display">0% पूर्ण</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" style="width: 0%;"></div>
                </div>
            </div>

            <div class="chapters-header">
                <h2 style="font-family: var(--font-hindi); font-size: 1.5rem;">सभी अध्याय</h2>
                <i class="ri-sort-desc" style="font-size: 1.5rem; color: var(--text-secondary);"></i>
            </div>

            <!-- यहाँ JS से एकदम परफेक्ट कार्ड्स आएंगे -->
            <div class="chapters-list" id="dynamic-chapter-list">
                <!-- Chapters load here -->
            </div>
        </main>
    </div>

    <script src="chapters.js"></script>
</body>
</html>
