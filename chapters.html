<!DOCTYPE html>
<html lang="hi" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अध्याय चुनें | क्वांटम मास्टर स्टडी</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- साउंड और BGM प्लेयर (यहीं से हर पेज पर म्यूजिक बजता है) -->
    <audio id="sfx-click" preload="auto">
        <source src="click.mp3" type="audio/mpeg">
    </audio>
    <audio id="bgm-audio" loop preload="auto">
        <source src="bgm1.mp3" type="audio/mpeg">
    </audio>
    
    <canvas id="bg-canvas"></canvas>

    <div class="chapters-main">
        <header class="dash-header glass-panel" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-radius: 20px; margin-bottom: 2rem;">
            <div class="brand-mini sfx-trigger" onclick="window.location.href='subjects.html'" style="cursor:pointer; display: flex; align-items: center; gap: 8px;">
                <i class="ri-arrow-left-line" style="font-size: 1.5rem; color: var(--accent-main);"></i>
                <h2 style="font-size: 1.2rem;">विषयों पर लौटें</h2>
            </div>
            
            <div class="small-profile-btn sfx-trigger" onclick="window.location.href='dashboard.html'" title="डैशबोर्ड">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Student&backgroundColor=b6e3f4" id="nav-profile-img" alt="Profile">
            </div>
        </header>

        <!-- Dynamic Subject Hero Card -->
        <div class="subject-hero-card glass-card">
            <div class="hero-content">
                <div class="board-tag">कक्षा 12वीं - NCERT</div>
                <div class="hero-title-group">
                    <div class="hero-icon" id="chap-hero-icon">
                        <i class="ri-book-open-fill"></i>
                    </div>
                    <div>
                        <h1 id="chap-hero-title">विषय लोड हो रहा है...</h1>
                        <p id="chap-hero-subtitle">Loading...</p>
                    </div>
                </div>
            </div>
            <div class="progress-stats">
                <span id="chap-progress-text">प्रोग्रेस: 0%</span>
                <span id="chap-count-text">0 / 0 अध्याय पूर्ण</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="chap-progress-bar" style="width: 0%;"></div>
            </div>
        </div>

        <div class="chapters-header">
            <h2>सभी अध्याय</h2>
            <i class="ri-sort-desc" style="font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;"></i>
        </div>

        <!-- YAHAN CHAPTERS DYNAMICALLY AAYENGE JS SE -->
        <div class="chapters-list" id="dynamic-chapters-container">
            <p style="text-align: center; color: var(--text-secondary); padding: 2rem;">अध्याय लोड हो रहे हैं...</p>
        </div>

    </div>

    <!-- MAIN JAVASCRIPT LOGIC FOR CHAPTERS PAGE -->
    <script src="chapters.js"></script>
</body>
</html>
