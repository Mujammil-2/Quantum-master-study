<!DOCTYPE html>
<html lang="hi" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>डैशबोर्ड | क्वांटम मास्टर स्टडी</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Premium Dashboard Fixes */
        .dash-main-clean {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            animation: fadeUp 0.6s ease;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
        }
        .small-profile-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--accent-main);
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,240,255,0.2);
            transition: 0.3s;
        }
        .small-profile-btn:hover { transform: scale(1.05); }
        .small-profile-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <audio id="sfx-click" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-modern-technology-select-3124.mp3" type="audio/mpeg">
    </audio>

    <div id="particle-canvas-container"></div>

    <div class="dashboard-wrapper">
        <!-- टॉप हेडर (कोने में प्रोफाइल फोटो के साथ) -->
        <header class="top-nav glass-panel">
            <div class="brand-mini">
                <div class="logo-icon"><i class="ri-atom-line"></i></div>
                <h2>QMS</h2>
            </div>
            
            <!-- यह है तुम्हारा कोने वाला प्रोफाइल बटन -->
            <div class="small-profile-btn sfx-trigger" onclick="window.location.href='profile.html'" title="प्रोफाइल सेटिंग्स">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Student&backgroundColor=b6e3f4" id="dash-small-avatar" alt="Profile">
            </div>
        </header>

        <main class="dash-main-clean">
            <!-- क्लीन वेलकम सेक्शन -->
            <div class="welcome-section" style="margin-bottom: 2rem;">
                <h1 class="greeting" style="font-family: var(--font-heading); font-size: 2rem;">नमस्ते, <span class="highlight" id="dash-user-name">Student</span> 👋</h1>
                <p class="subtitle" style="color: var(--text-secondary);">आज कुछ नया सीखने का समय है!</p>
            </div>

            <!-- स्टैट्स (Stats) -->
            <div class="stats-grid">
                <div class="stat-card glass-card">
                    <div class="stat-icon"><i class="ri-fire-fill"></i></div>
                    <div class="stat-info">
                        <h3 class="stat-number streak-badge"><span>1 दिन</span></h3>
                        <p>एक्टिव स्ट्रीक</p>
                    </div>
                </div>
                
                <div class="stat-card glass-card sfx-trigger" onclick="window.location.href='subjects.html'" style="cursor:pointer;">
                    <div class="stat-icon"><i class="ri-book-open-fill"></i></div>
                    <div class="stat-info">
                        <h3 class="stat-number">5</h3>
                        <p>विषय (Subjects)</p>
                    </div>
                </div>
                
                <div class="stat-card glass-card">
                    <div class="stat-icon"><i class="ri-check-double-fill"></i></div>
                    <div class="stat-info">
                        <h3 class="stat-number" id="dash-completed-count">0</h3>
                        <p>पूर्ण किए गए</p>
                    </div>
                </div>
                
                <div class="stat-card glass-card">
                    <div class="stat-icon"><i class="ri-copper-coin-fill"></i></div>
                    <div class="stat-info">
                        <h3 class="stat-number" id="dash-total-xp">0</h3>
                        <p>कुल पॉइंट्स (XP)</p>
                    </div>
                </div>
            </div>

            <button class="btn-primary-glow sfx-trigger" onclick="window.location.href='subjects.html'" style="margin-top: 2rem; width: 100%; padding: 15px; font-size: 1.1rem;">
                स्टडी शुरू करें <i class="ri-arrow-right-line"></i>
            </button>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
