<!DOCTYPE html>
<html lang="hi" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>डैशबोर्ड | क्वांटम मास्टर स्टडी</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="sfx-click" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-modern-technology-select-3124.mp3" type="audio/mpeg">
    </audio>

    <div id="particle-canvas-container"></div>

    <div class="dashboard-wrapper">
        <header class="dash-header glass-panel">
            <div class="brand-mini">
                <div class="logo-icon"><i class="ri-atom-line"></i></div>
                <h2>QMS</h2>
            </div>
            
            <!-- यहाँ प्रोफाइल का लिंक सेट कर दिया गया है -->
            <div class="user-profile sfx-trigger" onclick="window.location.href='profile.html'" style="cursor:pointer;" title="माई प्रोफाइल">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Alina&backgroundColor=b6e3f4" alt="Alina Sami">
            </div>
        </header>

        <main class="dash-main">
            <!-- वेलकम सेक्शन -->
            <div class="welcome-section">
                <h1 class="greeting">नमस्ते, <span class="highlight">Alina</span> 👋</h1>
                <p class="subtitle">आज कुछ नया सीखने का समय है!</p>
            </div>

            <!-- स्टैट्स (Stats) -->
            <div class="stats-grid">
                <div class="stat-card glass-card">
                    <div class="stat-icon"><i class="ri-fire-fill"></i></div>
                    <div class="stat-info">
                        <h3 class="stat-number streak-badge"><span>1 दिन</span></h3>
                        <p>एक्टिव स्ट्रीक</p>
                    </div>
                </div>
                
                <div class="stat-card glass-card sfx-trigger" onclick="window.location.href='subjects.html'" style="cursor:pointer;">
                    <div class="stat-icon"><i class="ri-book-open-fill"></i></div>
                    <div class="stat-info">
                        <h3 class="stat-number">5</h3>
                        <p>विषय (Subjects)</p>
                    </div>
                </div>
                
                <div class="stat-card glass-card">
                    <div class="stat-icon"><i class="ri-check-double-fill"></i></div>
                    <div class="stat-info">
                        <h3 class="stat-number">0</h3>
                        <p>पूर्ण किए गए</p>
                    </div>
                </div>
                
                <div class="stat-card glass-card">
                    <div class="stat-icon"><i class="ri-copper-coin-fill"></i></div>
                    <div class="stat-info">
                        <h3 class="stat-number">0</h3>
                        <p>कुल पॉइंट्स (XP)</p>
                    </div>
                </div>
            </div>

            <!-- डेली गोल -->
            <div class="continue-learning glass-card">
                <div class="card-header">
                    <h3><i class="ri-focus-2-line"></i> दैनिक लक्ष्य (Daily Goal)</h3>
                    <span class="badge">Keep it up!</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" style="width: 10%;"></div>
                </div>
                
                <button class="btn-primary-glow sfx-trigger" onclick="window.location.href='subjects.html'" style="margin-top: 1.5rem; width: 100%;">
                    स्टडी शुरू करें <i class="ri-arrow-right-line"></i>
                </button>
            </div>

        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
