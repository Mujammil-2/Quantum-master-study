<!DOCTYPE html>
<html lang="hi" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मॉक टेस्ट | क्वांटम मास्टर स्टडी</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root { --bg-deep: #020612; --accent-cyan: #00f0ff; --accent-blue: #0055ff; --accent-purple: #b535ff; }
        body { background-color: var(--bg-deep); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; flex-direction: column; }
        
        /* टॉप नेविगेशन */
        .quiz-header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 15px 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .back-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 8px 15px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
        .back-btn:hover { background: var(--accent-cyan); color: #000; }
        .quiz-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; color: var(--accent-cyan); font-weight: bold; text-transform: capitalize; }
        
        /* मेन क्विज़ कार्ड */
        .quiz-card { background: linear-gradient(180deg, #10182b 0%, #0b1120 100%); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; width: 100%; max-width: 800px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); position: relative; overflow: hidden; }
        
        .loading-state { text-align: center; padding: 50px 0; color: var(--accent-cyan); }
        
        .quiz-content { display: none; } /* डेटा आने पर इसे दिखाएंगे */
        
        .question-meta { display: flex; justify-content: space-between; margin-bottom: 20px; color: #8b96a8; font-size: 0.9rem; font-weight: 500; }
        .question-text { font-size: 1.4rem; line-height: 1.5; margin-bottom: 30px; font-weight: 600; }
        
        .options-grid { display: flex; flex-direction: column; gap: 15px; }
        .option-btn { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #fff; padding: 18px 20px; border-radius: 12px; font-size: 1.1rem; text-align: left; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 15px; }
        .option-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); transform: translateX(5px); }
        
        /* सही-गलत के लिए क्लासेज़ (JS से लगेंगी) */
        .option-btn.selected { background: rgba(0, 240, 255, 0.2); border-color: var(--accent-cyan); }
        .option-btn.correct { background: rgba(0, 255, 136, 0.2); border-color: #00ff88; color: #00ff88; }
        .option-btn.wrong { background: rgba(255, 51, 102, 0.2); border-color: #ff3366; color: #ff3366; }

        .next-btn { width: 100%; background: var(--accent-blue); color: #fff; padding: 16px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-top: 30px; transition: 0.3s; display: none; }
        .next-btn:hover { background: #0044cc; box-shadow: 0 0 15px rgba(0, 85, 255, 0.5); }
        
        /* रिजल्ट स्क्रीन */
        .result-screen { display: none; text-align: center; padding: 20px 0; }
        .trophy-icon { font-size: 5rem; color: #ffd700; margin-bottom: 15px; animation: pulseGlow 2s infinite alternate; }
        .result-score { font-size: 2.5rem; font-weight: bold; margin-bottom: 10px; font-family: 'Space Grotesk', sans-serif; }
        .xp-earned { color: #00ff88; font-size: 1.2rem; font-weight: bold; margin-bottom: 30px; background: rgba(0,255,136,0.1); display: inline-block; padding: 10px 20px; border-radius: 30px; border: 1px dashed #00ff88; }
        
        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 10px rgba(255,215,0,0.5)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 30px rgba(255,215,0,0.8)); transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="quiz-header">
        <button class="back-btn" onclick="window.location.href='dashboard.html'"><i class="ri-arrow-left-line"></i> डैशबोर्ड</button>
        <div class="quiz-title" id="quiz-header-title">प्रश्नोत्तरी (Quiz)</div>
    </div>

    <div class="quiz-card">
        <!-- 1. लोडिंग स्टेट -->
        <div class="loading-state" id="loading-box">
            <i class="ri-loader-4-line" style="font-size: 3rem; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 15px;"></i>
            <h3>क्लाउड से आपके लिए बेहतरीन सवाल छांटे जा रहे हैं...</h3>
            <p style="color: #8b96a8; font-size: 0.9rem; margin-top: 5px;">थोड़ा इंतज़ार करें</p>
        </div>

        <!-- 2. क्विज़ इंटरफ़ेस -->
        <div class="quiz-content" id="quiz-box">
            <div class="question-meta">
                <span id="q-counter">प्रश्न 1 / 20</span>
                <span style="color: var(--accent-cyan);"><i class="ri-timer-line"></i> <span id="timer-display">30</span>s</span>
            </div>
            
            <div class="question-text" id="question-text">
                प्रश्न यहाँ आएगा...
            </div>
            
            <div class="options-grid" id="options-box">
                <!-- ऑप्शंस JS से आएँगे -->
            </div>
            
            <button class="next-btn" id="next-btn">अगला प्रश्न <i class="ri-arrow-right-line"></i></button>
        </div>

        <!-- 3. रिजल्ट स्क्रीन -->
        <div class="result-screen" id="result-box">
            <i class="ri-trophy-fill trophy-icon"></i>
            <h2>टेस्ट पूरा हुआ!</h2>
            <div class="result-score" id="final-score-text">15 / 20</div>
            <div class="xp-earned" id="xp-earned-text">+150 XP क्लाउड में सेव हुआ!</div>
            
            <button class="next-btn" style="display: block; width: 100%;" onclick="window.location.href='leaderboard.html'">
                <i class="ri-bar-chart-fill"></i> लीडरबोर्ड देखें
            </button>
            <button class="back-btn" style="width: 100%; justify-content: center; margin-top: 15px; padding: 15px; background: rgba(255,255,255,0.05);" onclick="window.location.href='dashboard.html'">
                डैशबोर्ड पर वापस जाएँ
            </button>
        </div>
    </div>

    <!-- FIREBASE AND QUIZ ENGINE (ES MODULE) -->
    <script type="module" src="quiz.js"></script>
    
    <style> @keyframes spin { 100% { transform: rotate(360deg); } } </style>
</body>
</html>
