<!DOCTYPE html>
<html lang="hi" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>क्वांटम मास्टर स्टडी (QMS) | प्रीमियम पीसीएम प्लेटफॉर्म</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="bg-music" loop preload="auto">
        <source src="https://assets.mixkit.co/music/preview/mixkit-deep-meditation-109.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-click" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-modern-technology-select-3124.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-theme" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-sci-fi-click-900.mp3" type="audio/mpeg">
    </audio>

    <canvas id="particle-canvas"></canvas>

    <div class="theme-switcher glass-panel">
        <div class="theme-btn sfx-theme-trigger" data-set-theme="default" style="--btn-color: #00d4ff;" title="नियॉन ब्लू"></div>
        <div class="theme-btn sfx-theme-trigger" data-set-theme="cyberpunk" style="--btn-color: #ff00ff;" title="साइबरपंक"></div>
        <div class="theme-btn sfx-theme-trigger" data-set-theme="emerald" style="--btn-color: #00ff88;" title="एमराल्ड"></div>
        <div class="theme-btn sfx-theme-trigger" data-set-theme="sunset" style="--btn-color: #ff5e00;" title="सनसेट"></div>
        <div class="theme-btn sfx-theme-trigger" data-set-theme="crimson" style="--btn-color: #ff003c;" title="क्रिमसन"></div>
        <div class="theme-btn sfx-theme-trigger" data-set-theme="royal" style="--btn-color: #ffd700;" title="रॉयल"></div>
    </div>

    <main class="landing-wrapper">
        <div class="glass-card login-box">
            <div class="brand-logo">
                <i class="ri-reactjs-line brand-icon"></i>
            </div>
            <h1 class="brand-title">क्यू एम एस<span>.</span></h1>
            <p class="brand-subtitle">Quantum Master Study</p>
            
            <div class="features-list">
                <p><i class="ri-check-double-line"></i> Master <b>Physics</b>.</p>
                <p><i class="ri-check-double-line"></i> Master <b>Chemistry</b>.</p>
                <p><i class="ri-check-double-line"></i> Master <b>Mathematics</b>.</p>
            </div>

            <button class="btn-google sfx-trigger" id="google-login-btn">
                <i class="ri-google-fill"></i> Continue with Google
            </button>
            
            <p class="footer-text">EST. 2026 • PHASE 1: FOUNDATION</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
