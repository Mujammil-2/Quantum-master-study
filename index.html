    <style>
        body { background-color: #050b14; color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.6; pointer-events: none; }
        .auth-container { background: rgba(12, 19, 34, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 20px; padding: 40px 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); z-index: 10; }
        .auth-logo { width: 80px; height: 80px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); border: 2px solid #00f0ff; object-fit: cover; }
        .auth-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; margin-bottom: 5px; color: #fff; }
        .auth-sub { font-size: 0.85rem; color: #8b96a8; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; color: #8b96a8; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
        .auth-btn { width: 100%; padding: 14px; background: #00f0ff; color: #000; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0, 240, 255, 0.3); }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 240, 255, 0.5); }
        .auth-switch { font-size: 0.85rem; color: #8b96a8; cursor: pointer; transition: 0.2s; }
        .auth-switch:hover { color: #00f0ff; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="auth-container">
        <img src="logo.png" alt="QMS Logo" class="auth-logo">
        <h1 class="auth-title">QMS में आपका स्वागत है</h1>
        <p class="auth-sub">प्रीमियम लर्निंग का नया अनुभव</p>

        <!-- Login Form -->
        <div id="login-form">
            <div class="input-group">
                <label>ईमेल (Email)</label>
                <input type="email" id="login-email" placeholder="student@qms.com">
            </div>
            <div class="input-group">
                <label>पासवर्ड (Password)</label>
                <input type="password" id="login-password" placeholder="********">
            </div>
            <button class="auth-btn" id="login-btn">लॉगिन करें</button>
            <p class="auth-switch" id="go-to-signup">अकाउंट नहीं है? <b>नया अकाउंट बनाएं</b></p>
        </div>

        <!-- Signup Form (Hidden by default) -->
        <div id="signup-form" style="display: none;">
            <div class="input-group">
                <label>पूरा नाम (Full Name)</label>
                <input type="text" id="signup-name" placeholder="आपका नाम">
            </div>
            <div class="input-group">
                <label>ईमेल (Email)</label>
                <input type="email" id="signup-email" placeholder="student@qms.com">
            </div>
            <div class="input-group">
                <label>पासवर्ड (Password)</label>
                <input type="password" id="signup-password" placeholder="********">
            </div>
            <button class="auth-btn" id="signup-btn">रजिस्टर करें</button>
            <p class="auth-switch" id="go-to-login">पहले से अकाउंट है? <b>लॉगिन करें</b></p>
        </div>
    </div>

    <!-- Firebase Auth Script -->
    <script type="module" src="app.js"></script>
    
    <!-- Background Animation (Formulas) -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d'); 
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const mathSymbols = ['∑', 'π', '∞', '∫', 'Ω', 'E=mc²', 'H₂O', 'θ', 'λ', '⚛', 'α', 'β'];
        let particles = [];
        
        for (let i = 0; i < 40; i++) {
            particles.push({
                isSymbol: Math.random() > 0.5,
                text: mathSymbols[Math.floor(Math.random() * mathSymbols.length)],
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                size: Math.random() > 0.5 ? Math.random() * 12 + 10 : Math.random() * 3 + 1,
                vx: Math.random() * 1 - 0.5, vy: Math.random() * -0.8 - 0.2,
                angle: Math.random() * Math.PI * 2, spin: Math.random() * 0.05 + 0.02
            });
        }
        
        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { 
                p.y += p.vy; p.x += p.vx; p.angle += p.spin;
                if (p.y < -30) { p.y = canvas.height + 30; p.x = Math.random() * canvas.width; }
                if (p.x < -30 || p.x > canvas.width + 30) p.vx *= -1;
                
                ctx.fillStyle = `rgba(255, 255, 255, ${((Math.sin(p.angle) + 1) / 2) * 0.4 + 0.1})`;
                if (p.isSymbol) { ctx.font = `${p.size}px "Space Grotesk", sans-serif`; ctx.fillText(p.text, p.x, p.y); } 
                else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // UI Toggle
        document.getElementById('go-to-signup').addEventListener('click', () => {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'block';
        });
        document.getElementById('go-to-login').addEventListener('click', () => {
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
        });
    </script>
</body>
