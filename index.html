<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Quantum Master Study</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root { --bg-deep: #020612; --card-bg: #0b1120; --btn-bg: #141c2f; --btn-border: #1e293b; --accent-cyan: #00f0ff; --accent-blue: #0055ff; }
        body { background-color: var(--bg-deep); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        
        #particle-waves { position: absolute; bottom: 0; left: 0; width: 100%; height: 60%; z-index: -2; opacity: 0.8; }
        .ambient-glow { position: absolute; bottom: -10%; left: 50%; transform: translateX(-50%); width: 80vw; height: 50vh; background: radial-gradient(ellipse, rgba(0, 85, 255, 0.25) 0%, transparent 70%); filter: blur(80px); z-index: -3; }
        
        .floating-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .f-icon { position: absolute; color: rgba(255, 255, 255, 0.03); font-size: 5rem; animation: floatAnim 8s infinite ease-in-out alternate; }
        .f-icon:nth-child(1) { top: 15%; left: 8%; } .f-icon:nth-child(2) { top: 35%; left: 4%; font-family: 'Space Grotesk'; font-size: 2.5rem; transform: rotate(-15deg); } .f-icon:nth-child(3) { top: 65%; left: 10%; font-size: 6rem; } .f-icon:nth-child(4) { top: 10%; right: 10%; font-size: 4rem; } .f-icon:nth-child(5) { top: 40%; right: 5%; font-size: 5rem; } .f-icon:nth-child(6) { top: 70%; right: 12%; font-family: 'Space Grotesk'; font-size: 2rem; }
        @keyframes floatAnim { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-30px) rotate(5deg); } }

        .main-wrapper { width: 100%; max-width: 440px; padding: 20px; z-index: 10; display: flex; flex-direction: column; align-items: center; }
        .brand-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .logo-box svg { width: 70px; height: 70px; filter: drop-shadow(0 0 10px rgba(0, 168, 255, 0.3)); }
        .brand-text-col { display: flex; flex-direction: column; }
        .b-title1 { font-size: 1.8rem; font-weight: 700; color: #fff; line-height: 1.1; letter-spacing: 0.5px; }
        .b-title2 { font-size: 1.8rem; font-weight: 700; color: var(--accent-cyan); line-height: 1.1; }
        .b-tag { font-size: 0.75rem; color: #8b96a8; margin-top: 4px; letter-spacing: 1px; }

        .welcome-title { font-size: 2.2rem; font-weight: 700; margin-bottom: 5px; text-align: center; }
        .welcome-sub { font-size: 0.95rem; color: #8b96a8; margin-bottom: 35px; text-align: center; }

        .login-card { background: linear-gradient(180deg, rgba(16, 24, 43, 0.95) 0%, rgba(11, 17, 32, 0.95) 100%); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 35px 30px; width: 100%; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .card-heading { text-align: center; font-size: 1.2rem; font-weight: 600; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .heading-line { display: flex; align-items: center; gap: 6px; }
        .heading-line span:nth-child(1), .heading-line span:nth-child(3) { width: 30px; height: 1px; background: rgba(255,255,255,0.15); }
        .heading-line span:nth-child(2) { width: 35px; height: 3px; background: var(--accent-blue); border-radius: 2px; box-shadow: 0 0 10px var(--accent-blue); }

        .auth-btn { width: 100%; background: var(--btn-bg); border: 1px solid var(--btn-border); color: #e2e8f0; padding: 14px 20px; border-radius: 12px; font-size: 0.95rem; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 14px; cursor: pointer; transition: all 0.2s ease; }
        .auth-btn:hover:not(:disabled) { background: #1e293b; border-color: #334155; color: #fff; }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-icon-box { background: #fff; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .auth-btn.phone .btn-icon-box { background: #10b981; }
        .auth-btn svg, .auth-btn i { width: 16px; height: 16px; color: #fff; font-size: 16px; }
        .auth-btn span.btn-txt { flex: 1; text-align: left; }

        .divider { display: flex; align-items: center; color: #8b96a8; font-size: 0.8rem; margin: 20px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .divider::before { margin-right: 15px; } .divider::after { margin-left: 15px; }

        .guest-btn { width: 100%; background: transparent; border: 1px solid #0088ff; color: #fff; padding: 14px 20px; border-radius: 12px; font-size: 0.95rem; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; box-shadow: inset 0 0 10px rgba(0, 136, 255, 0.1); }

        /* Strict Auth Modal */
        .auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 18, 0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .auth-modal-box { background: #0b1120; border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; text-align: center; }
        .auth-modal-box h3 { font-size: 1.4rem; margin-bottom: 10px; color: #fff; }
        .auth-modal-box p { font-size: 0.85rem; color: #8b96a8; margin-bottom: 20px; }
        .modal-input { width: 100%; background: #141c2f; border: 1px solid #1e293b; color: #fff; padding: 12px 15px; border-radius: 10px; font-size: 1.1rem; margin-bottom: 15px; text-align: center; letter-spacing: 2px; }
        .modal-input:focus { outline: none; border-color: #0088ff; }
        .modal-btn { width: 100%; background: #0055ff; color: #fff; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }

        .toast-msg { position: fixed; top: 20px; right: -350px; background: #111827; border-left: 4px solid var(--accent-cyan); color: #fff; padding: 15px 20px; border-radius: 8px; z-index: 1000; transition: right 0.4s ease; display: flex; gap:10px; align-items: center; }
        .toast-msg.show { right: 20px; }
    </style>
</head>
<body>

    <div id="login-toast" class="toast-msg"><i class="ri-information-line"></i><span id="toast-text"></span></div>
    <div id="recaptcha-container"></div>

    <!-- Phone Verification Modal (STRICT) -->
    <div id="auth-modal" class="auth-modal">
        <div class="auth-modal-box">
            <h3 id="modal-title">Phone Verification</h3>
            <p id="modal-desc">Enter your mobile number (+91)</p>
            <input type="text" id="modal-input" class="modal-input" placeholder="+91 98765 43210">
            <button id="modal-btn" class="modal-btn" onclick="handlePhoneAuthAction()">Send Real OTP</button>
        </div>
    </div>

    <canvas id="particle-waves"></canvas>
    <div class="ambient-glow"></div>

    <div class="floating-bg">
        <i class="ri-reactjs-line f-icon"></i><div class="f-icon">E = mc²</div><i class="ri-flask-line f-icon"></i><div class="f-icon">y = sin x</div>
    </div>

    <div class="main-wrapper">
        <div class="brand-header">
            <div class="logo-box">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 85C30.67 85 15 69.33 15 50C15 30.67 30.67 15 50 15C69.33 15 85 30.67 85 50C85 62.1 78.8 72.8 69.4 79" stroke="#00a8ff" stroke-width="12" stroke-linecap="round"/>
                    <path d="M62 65L88 91" stroke="#0055ff" stroke-width="14" stroke-linecap="round"/>
                    <path d="M10 28L50 10L90 28L50 46Z" fill="#00a8ff"/>
                    <path d="M90 28V45" stroke="#00a8ff" stroke-width="4" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="brand-text-col">
                <span class="b-title1">Quantum</span><span class="b-title2">Master Study</span><span class="b-tag">Learn • Practice • Master</span>
            </div>
        </div>

        <h1 class="welcome-title">Welcome Back!</h1>
        <p class="welcome-sub">Login securely to continue</p>

        <div class="login-card">
            <div class="card-heading">Login to Your Account<div class="heading-line"><span></span><span></span><span></span></div></div>

            <button class="auth-btn phone" onclick="window.openPhoneModal()">
                <div class="btn-icon-box"><i class="ri-phone-fill"></i></div>
                <span class="btn-txt">Continue with Phone Number</span>
            </button>

            <button class="auth-btn" onclick="window.handleGoogleLogin(this)">
                <div class="btn-icon-box">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                </div>
                <span class="btn-txt">Continue with Google</span>
            </button>

            <div class="divider">OR</div>

            <button class="guest-btn" onclick="window.location.href='dashboard.html'">
                <i class="ri-user-line"></i><span style="flex:1; text-align:left;">Continue as Guest</span>
            </button>
        </div>
    </div>

    <script>
        function showToast(msg) {
            const toast = document.getElementById('login-toast');
            document.getElementById('toast-text').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // Canvas Waves
        const canvas = document.getElementById('particle-waves');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        const cols = 40, rows = 15, spacing = 35;
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight * 0.6; }
        function initParticles() { particles = []; for (let i = 0; i < cols; i++) { for (let j = 0; j < rows; j++) { particles.push({ x: i * spacing - (cols * spacing) / 2, z: j * spacing - (rows * spacing) / 2, y: 0, angle: (i * 0.3) + (j * 0.3) }); } } }
        let time = 0;
        function drawWaves() {
            ctx.clearRect(0, 0, width, height); time += 0.03;
            const cx = width / 2, cy = height / 1.5;
            particles.forEach(p => {
                p.y = Math.sin(p.angle + time) * 35;
                const scale = 400 / (400 + p.z + 200);
                const screenX = cx + p.x * scale, screenY = cy + (p.y + p.z * 0.5) * scale;
                if (screenX > 0 && screenX < width && screenY > 0 && screenY < height) {
                    ctx.beginPath(); ctx.arc(screenX, screenY, Math.max(0.5, 3 * scale), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, ${100 + ((p.y + 35)/70) * 155}, 255, ${Math.min(1, scale * 1.5)})`; ctx.fill();
                }
            }); requestAnimationFrame(drawWaves);
        }
        window.addEventListener('resize', () => { resize(); initParticles(); });
        resize(); initParticles(); drawWaves();
    </script>

    <!-- STRICT AUTH SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCkxx9bVjvAYarA0WrHfW5k_gxwUPZaaw",
            authDomain: "quantum-master-study.firebaseapp.com",
            projectId: "quantum-master-study",
            storageBucket: "quantum-master-study.firebasestorage.app",
            messagingSenderId: "193145760847",
            appId: "1:193145760847:web:7d1f77be123c3edb104e3a",
            measurementId: "G-SH39JL930R"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        let confirmationResultGlobal = null;
        let phoneStep = 1;

        window.handleGoogleLogin = async function(btn) {
            btn.disabled = true; showToast("Connecting to Google securely...");
            try {
                const result = await signInWithPopup(auth, googleProvider);
                localStorage.setItem('qms_user_name', result.user.displayName || '');
                localStorage.setItem('qms_user_email', result.user.email || '');
                localStorage.setItem('qms_user_photo', result.user.photoURL || '');
                localStorage.setItem('qms_auth_provider', 'Google');
                showToast("Authorized! Redirecting to setup...");
                setTimeout(() => window.location.href = 'profile-setup.html', 1200);
            } catch (error) {
                showToast("Login Failed! Please try again."); btn.disabled = false;
            }
        };

        window.openPhoneModal = function() {
            document.getElementById('auth-modal').style.display = 'flex';
            document.getElementById('modal-title').innerText = "Phone Verification";
            document.getElementById('modal-desc').innerText = "Enter your mobile number (+91)";
            const input = document.getElementById('modal-input');
            input.value = "+91 "; input.removeAttribute('maxlength');
            document.getElementById('modal-btn').innerText = "Send Real OTP";
            phoneStep = 1;
        };

        window.onload = function() {
            if (!window.recaptchaVerifier) {
                window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });
            }
        };

        window.handlePhoneAuthAction = async function() {
            const inputField = document.getElementById('modal-input');
            const val = inputField.value.trim();
            const btn = document.getElementById('modal-btn');

            if (phoneStep === 1) {
                if (val.length < 10) { showToast("Enter valid number!"); return; }
                btn.innerText = "Sending SMS..."; btn.disabled = true;
                try {
                    confirmationResultGlobal = await signInWithPhoneNumber(auth, val, window.recaptchaVerifier);
                    phoneStep = 2;
                    document.getElementById('modal-title').innerText = "Enter OTP";
                    document.getElementById('modal-desc').innerText = `Code sent to ${val}`;
                    inputField.value = ""; inputField.placeholder = "Enter 6 digits";
                    inputField.setAttribute('maxlength', '6'); // STRICT 6 DIGIT FREEZE
                    btn.innerText = "Verify OTP"; btn.disabled = false;
                    showToast("Real SMS Sent!");
                } catch (error) {
                    showToast("Failed to send SMS: " + error.message);
                    btn.innerText = "Send Real OTP"; btn.disabled = false;
                }
            } else {
                if (val.length !== 6) { showToast("Enter exactly 6 digits!"); return; }
                btn.innerText = "Verifying..."; btn.disabled = true;
                try {
                    const result = await confirmationResultGlobal.confirm(val);
                    localStorage.setItem('qms_user_name', '');
                    localStorage.setItem('qms_user_email', ''); 
                    localStorage.setItem('qms_user_photo', ''); 
                    localStorage.setItem('qms_user_phone', result.user.phoneNumber);
                    localStorage.setItem('qms_auth_provider', 'Phone');
                    showToast("OTP Verified! Complete your profile...");
                    setTimeout(() => window.location.href = 'profile-setup.html', 1200);
                } catch (error) {
                    showToast("Wrong OTP! Try again.");
                    btn.innerText = "Verify OTP"; btn.disabled = false;
                }
            }
        };
    </script>
</body>
</html>
