<!DOCTYPE html>
<html lang="hi" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विषय चुनें | क्वांटम मास्टर स्टडी</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        /* Subjects Page Specific Styles */
        .class-tabs { display: flex; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .tab-btn { flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; font-family: var(--font-heading); border: none; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        .tab-btn.active { background: var(--accent-main); color: #000; box-shadow: 0 0 15px var(--accent-glow); }
        .tab-btn:not(.active) { background: transparent; color: var(--text-secondary); }
        
        .subject-card { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 18px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px; text-decoration: none; transition: 0.3s; }
        .subject-card:hover { transform: translateY(-3px); border-color: var(--accent-main); background: rgba(255,255,255,0.05); }
        
        .sub-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; flex-shrink: 0; background: rgba(255,255,255,0.05); }
        .sub-details { flex: 1; margin-left: 15px; }
        .sub-title { font-family: var(--font-heading); font-size: 1.2rem; color: #fff; margin-bottom: 2px; font-weight: 700; }
        .sub-eng { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; }
        .sub-meta { display: flex; gap: 15px; font-size: 0.75rem; font-weight: 600; }
    </style>
</head>
<body>

    <!-- 🌌 FIREFLY PARTICLES CANVAS -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- 🎵 AUDIO PLAYERS (For background music and SFX) -->
    <audio id="sfx-click" preload="auto"><source src="click.mp3" type="audio/mpeg"></audio>
    <audio id="bgm-audio" loop preload="auto"><source src="bgm1.mp3" type="audio/mpeg"></audio>

    <div class="dashboard-wrapper">
        
        <!-- 🌟 HEADER: BACK BUTTON & PROFILE FRAME FIX -->
        <header class="top-nav glass-panel dash-header" style="justify-content: space-between;">
            <a href="dashboard.html" class="sfx-trigger" style="color: #fff; display: flex; align-items: center; gap: 8px; font-weight: 600; transition: 0.2s;">
                <i class="ri-arrow-left-line" style="color: var(--accent-main); font-size: 1.3rem;"></i> 
                डैशबोर्ड पर लौटें
            </a>
            
            <div style="display:flex; align-items:center;">
                <!-- 🛠️ NEW PROFILE FRAME HTML (For dashboard.js to target) -->
                <a href="dashboard.html" class="small-profile-btn header-profile-fix sfx-trigger" id="open-panel-btn" title="प्रोफाइल">
                    <div class="avatar-frame-wrapper" id="header-avatar-frame">
                        <img src="logo.png" id="dash-small-avatar" alt="Profile Image">
                    </div>
                </a>
            </div>
        </header>

        <main style="padding: 20px;">
            
            <!-- CLASS TOGGLE TABS -->
            <div class="class-tabs">
                <button class="tab-btn active sfx-trigger">कक्षा 12वीं (Board)</button>
                <button class="tab-btn sfx-trigger">कक्षा 11वीं (Foundation)</button>
            </div>

            <!-- PAGE TITLE -->
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="font-family: var(--font-heading); font-size: 2rem; color: #fff; margin-bottom: 5px;">अपना विषय चुनें</h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">क्वांटम मास्टर स्टडी का संपूर्ण NCERT पाठ्यक्रम</p>
            </div>

            <!-- 📚 SUBJECT CARDS -->
            <div class="subjects-list">
                
                <!-- PHYSICS -->
                <a href="#" class="subject-card glass-card sfx-trigger">
                    <div class="sub-icon" style="color: #00f0ff; border: 1px solid rgba(0, 240, 255, 0.2);"><i class="ri-flashlight-fill"></i></div>
                    <div class="sub-details">
                        <h3 class="sub-title">भौतिक विज्ञान</h3>
                        <p class="sub-eng">Physics (PCM / PCB)</p>
                        <div class="sub-meta">
                            <span style="color: var(--text-secondary);"><i class="ri-book-3-line"></i> 14 अध्याय</span>
                            <span style="color: #00ff88;"><i class="ri-line-chart-line"></i> प्रोग्रेस उपलब्ध</span>
                        </div>
                    </div>
                    <i class="ri-arrow-right-s-line" style="color: var(--text-secondary); font-size: 1.5rem;"></i>
                </a>

                <!-- CHEMISTRY -->
                <a href="#" class="subject-card glass-card sfx-trigger">
                    <div class="sub-icon" style="color: #b535ff; border: 1px solid rgba(181, 53, 255, 0.2);"><i class="ri-flask-fill"></i></div>
                    <div class="sub-details">
                        <h3 class="sub-title">रसायन विज्ञान</h3>
                        <p class="sub-eng">Chemistry (PCM / PCB)</p>
                        <div class="sub-meta">
                            <span style="color: var(--text-secondary);"><i class="ri-book-3-line"></i> 10 अध्याय</span>
                            <span style="color: #00ff88;"><i class="ri-line-chart-line"></i> प्रोग्रेस उपलब्ध</span>
                        </div>
                    </div>
                    <i class="ri-arrow-right-s-line" style="color: var(--text-secondary); font-size: 1.5rem;"></i>
                </a>

                <!-- MATHEMATICS -->
                <a href="#" class="subject-card glass-card sfx-trigger">
                    <div class="sub-icon" style="color: #ffc107; border: 1px solid rgba(255, 193, 7, 0.2);"><i class="ri-function-line"></i></div>
                    <div class="sub-details">
                        <h3 class="sub-title">गणित</h3>
                        <p class="sub-eng">Mathematics (PCM)</p>
                        <div class="sub-meta">
                            <span style="color: var(--text-secondary);"><i class="ri-book-3-line"></i> 13 अध्याय</span>
                            <span style="color: #00ff88;"><i class="ri-line-chart-line"></i> प्रोग्रेस उपलब्ध</span>
                        </div>
                    </div>
                    <i class="ri-arrow-right-s-line" style="color: var(--text-secondary); font-size: 1.5rem;"></i>
                </a>

            </div>
        </main>
    </div>

    <!-- 🌟 BOTTOM NAVIGATION BAR 🌟 -->
    <nav class="bottom-nav glass-panel">
        <a href="subjects.html" class="nav-item active sfx-trigger">
            <i class="ri-home-smile-fill"></i><span>Study</span>
        </a>
        <a href="quiz.html" class="nav-item sfx-trigger">
            <i class="ri-brain-line"></i><span>Quiz</span>
        </a>
        <div class="nav-item center-fab-wrapper">
            <!-- 🤖 AI Chatbot VIP Button (Glowing Center) -->
            <button class="center-fab sfx-trigger" onclick="window.location.href='ai-bot.html'">
                <i class="ri-robot-2-fill"></i>
            </button>
        </div>
        <a href="chat.html" class="nav-item sfx-trigger">
            <i class="ri-discuss-line"></i><span>Chat</span>
        </a>
        <a href="bookmarks.html" class="nav-item sfx-trigger">
            <i class="ri-bookmark-3-line"></i><span>Saved</span>
        </a>
    </nav>

    <!-- 🛠️ LINK TO MASTER JS FILE -->
    <script type="module" src="dashboard.js"></script>
</body>
</html>
