<!DOCTYPE html>
<html lang="hi" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विषय चुनें | क्वांटम मास्टर स्टडी</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="sfx-click" preload="auto"><source src="click.mp3" type="audio/mpeg"></audio>
    <!-- जुगनू एनीमेशन के लिए कैनवास -->
    <canvas id="bg-canvas"></canvas>

    <div class="dashboard-wrapper">
        <header class="glass-panel" style="display: flex; padding: 1.2rem 1.5rem;">
            <div class="brand-mini sfx-trigger" onclick="window.location.href='dashboard.html'" style="cursor:pointer; display: flex; align-items: center; gap: 8px;">
                <i class="ri-arrow-left-line" style="font-size: 1.2rem;"></i>
                <h2 style="font-size: 1.1rem;">डैशबोर्ड पर लौटें</h2>
            </div>
        </header>

        <main class="subjects-main">
            <div class="class-selector glass-card">
                <button class="class-btn active sfx-trigger">कक्षा 12वीं (Board)</button>
                <button class="class-btn sfx-trigger">कक्षा 11वीं (Foundation)</button>
            </div>
            <div class="subjects-header">
                <h1 class="page-title">अपना विषय चुनें</h1>
                <p class="page-subtitle">क्वांटम मास्टर स्टडी का संपूर्ण NCERT पाठ्यक्रम</p>
            </div>
            <div class="subjects-grid">
                <div class="subject-card glass-card sfx-trigger" onclick="window.location.href='chapters.html?subject=physics'">
                    <div class="subject-icon physics-icon"><i class="ri-flashlight-fill"></i></div>
                    <div class="subject-details"><h2>भौतिक विज्ञान</h2><p>Physics (PCM)</p></div>
                    <i class="ri-arrow-right-s-line arrow-icon"></i>
                </div>
                <div class="subject-card glass-card sfx-trigger" onclick="window.location.href='chapters.html?subject=chemistry'">
                    <div class="subject-icon chemistry-icon"><i class="ri-test-tube-fill"></i></div>
                    <div class="subject-details"><h2>रसायन विज्ञान</h2><p>Chemistry (PCM)</p></div>
                    <i class="ri-arrow-right-s-line arrow-icon"></i>
                </div>
                <div class="subject-card glass-card sfx-trigger" onclick="window.location.href='chapters.html?subject=mathematics'">
                    <div class="subject-icon math-icon"><i class="ri-functions"></i></div>
                    <div class="subject-details"><h2>गणित</h2><p>Mathematics (PCM)</p></div>
                    <i class="ri-arrow-right-s-line arrow-icon"></i>
                </div>
            </div>
        </main>
    </div>
    <script src="subjects.js"></script>
</body>
</html>
