!DOCTYPE html>
<html lang="hi" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कंट्रोल सेंटर | क्वांटम मास्टर स्टडी</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>

    <audio id="sfx-click" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-modern-technology-select-3124.mp3" type="audio/mpeg">
    </audio>

    <div id="particle-canvas-container"></div>

    <div class="profile-wrapper">
        <!-- टॉप हेडर (Logo के साथ) -->
        <header class="dash-header glass-panel">
            <div class="brand-mini sfx-trigger" onclick="window.location.href='dashboard.html'" style="cursor:pointer;">
                <i class="ri-arrow-left-line"></i>
                <h2>डैशबोर्ड</h2>
            </div>
            <div class="brand-mini">
                <div class="logo-icon"><i class="ri-atom-line"></i></div>
                <h2>QMS</h2>
            </div>
        </header>

        <main class="profile-main">
            <!-- प्रोफाइल हीरो (Custom Image & Name Edit) -->
            <div class="profile-hero glass-card">
                <div class="image-upload-wrapper">
                    <img id="user-profile-img" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Alina&backgroundColor=b6e3f4" alt="User Avatar">
                    <!-- कैमरा आइकॉन जिससे फोन की गैलरी खुलेगी -->
                    <label for="img-upload" class="upload-btn sfx-trigger" title="फोटो बदलें"><i class="ri-camera-fill"></i></label>
                    <input type="file" id="img-upload" hidden accept="image/*">
                </div>
                
                <div class="user-details">
                    <h1 id="user-display-name">Alina Sami <i class="ri-edit-circle-fill edit-icon sfx-trigger" id="edit-name-btn" title="नाम बदलें"></i></h1>
                    <p class="tag">कक्षा 12वीं • Science (PCM)</p>
                </div>
            </div>
.js"></script>
</body>
